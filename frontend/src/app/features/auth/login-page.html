<section class="login" aria-labelledby="login-titulo">
  <h1 id="login-titulo">Entrar na Clínica Acolher</h1>

  @if (sessaoExpirou && !mensagemErro()) {
    <p class="aviso" role="status">Sua sessão terminou por inatividade. Entre novamente para continuar.</p>
  }

  @if (mensagemErro(); as msg) {
    <p class="alerta" role="alert">{{ msg }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <label for="email">E-mail</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />

    <label for="senha">Senha</label>
    <input id="senha" type="password" formControlName="senha" autocomplete="current-password" />

    @if (form.invalid && form.touched) {
      <p class="alerta">Informe o e-mail e a senha.</p>
    }

    <button type="submit" [disabled]="enviando()">{{ enviando() ? 'Entrando…' : 'Entrar' }}</button>
  </form>
</section>
